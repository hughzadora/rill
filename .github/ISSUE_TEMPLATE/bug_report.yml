name: Bug Report
description: Create a report to help us improve the template
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in `rill-template`! Please fill in the form below.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Create repository from template
        2. Run `mise install --locked`
        3. Run `mise run verify`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Bun version, mise version, etc.
      placeholder: macOS 27.2.0, Bun 1.4.5, mise 2026.x
    validations:
      required: true

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: Which checks did you run?
      options:
        - label: `mise run verify:fast`
          required: false
        - label: `mise run verify`
          required: false
        - label: `mise run qualify`
          required: false
